[project]
name = "jobtrack"
version = "0.1.0"
description = "Track job applications and employer responses by reading your Gmail inbox."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["gmail", "job-search", "applications", "tracking", "sqlite", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-dotenv>=1.0",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/omerdikyol/jobtrack"
Issues = "https://github.com/omerdikyol/jobtrack/issues"
Security = "https://github.com/omerdikyol/jobtrack/security/policy"

[project.scripts]
jobtrack = "jobtrack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobtrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
